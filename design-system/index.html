            "mainEntity": [
              { "@type": "Question", "name": "Como transportar meu animal de estimação em avião?", "acceptedAnswer": { "@type": "Answer", "text": "O transporte aéreo de animais começa pela análise de origem, destino, prazo, espécie, porte e regras da companhia aérea. Com isso, avaliamos possibilidades como viagem na cabine, bagagem acompanhada ou compartimento de cargas, além do planejamento da documentação." } },
              { "@type": "Question", "name": "O que é CVI para viagem internacional com pet?", "acceptedAnswer": { "@type": "Answer", "text": "O CVI, ou Certificado Veterinário Internacional, é um documento oficial usado no processo de saída do Brasil com animal de estimação. Os requisitos e a emissão seguem o fluxo da autoridade competente e as exigências do país de destino." } },
              { "@type": "Question", "name": "Como escolher a caixa de transporte ideal para meu pet?", "acceptedAnswer": { "@type": "Answer", "text": "A caixa de transporte para avião precisa respeitar as medidas do pet, ventilação, material, modalidade de embarque e regras da companhia aérea. Uma caixa adequada permite que o animal fique em posição natural e atende às especificações da viagem." } },
              { "@type": "Question", "name": "O deck inferior do avião é confortável para pets?", "acceptedAnswer": { "@type": "Answer", "text": "Quando a modalidade é bagagem acompanhada ou compartimento de cargas, o pet viaja em compartimento apropriado da aeronave. As condições dependem da companhia aérea, rota, caixa de transporte e critérios operacionais; por isso cada embarque precisa ser avaliado individualmente." } },
              { "@type": "Question", "name": "Alguém viaja com meu animal no deck inferior?", "acceptedAnswer": { "@type": "Answer", "text": "O pet não viaja acompanhado por uma pessoa dentro do compartimento de transporte. A operação é conduzida pela companhia aérea e pelas equipes de solo; quando aplicável, o tutor segue no mesmo voo e recebe orientação sobre cada etapa do embarque." } },
              { "@type": "Question", "name": "Animais braquicefálicos podem viajar de avião?", "acceptedAnswer": { "@type": "Answer", "text": "Cães e gatos braquicefálicos podem ter restrições específicas por causa de características respiratórias. A possibilidade de transporte aéreo depende da raça, condição veterinária, companhia aérea, rota e modalidade disponível no momento da viagem." } },
              { "@type": "Question", "name": "O transporte aéreo de animais é seguro?", "acceptedAnswer": { "@type": "Answer", "text": "O transporte de pets por avião segue processos, normas e cuidados próprios, mas a segurança depende de uma decisão bem planejada: rota adequada, documentação, caixa correta, condição do animal e regras atualizadas da companhia aérea e do destino." } },
